# Файл: nginx/default.conf - ФИНАЛЬНАЯ ИСПРАВЛЕННАЯ ВЕРСИЯ

server {
    listen 80;
    # Слушаем оба наших домена
    server_name admin.ecom.local ecom.local;
    charset utf-8;

    # Увеличиваем максимальный размер тела запроса (например, до 50 МБ)
    client_max_body_size 50M;
    # ---

    # Устанавливаем корневую директорию для Laravel ОДИН РАЗ наверху
    root /var/www/html/public;
    index index.php;

    location /storage {
        # Пытаемся найти файл. $uri - это /storage/products/file.jpg
        # Так как /storage - это символическая ссылка в /public, Nginx найдёт его.
        try_files $uri $uri/ =404;
    }

    # --- ПРАВИЛО №1: Запросы к БЭКЕНДУ ---
    # Все запросы, начинающиеся с /api/ или /sanctum/, отправляются в Laravel
    location ~ ^/(api|sanctum)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- ПРАВИЛО №2: Запросы к ФРОНТЕНДУ ---
    # Все остальные запросы (не /api/ и не /sanctum/) считаются запросами к фронтенду
    location / {
        # В зависимости от домена, проксируем на нужный Vue-контейнер
        if ($host = 'admin.ecom.local') {
            proxy_pass http://admin-app:5173;
        }
        if ($host = 'ecom.local') {
            proxy_pass http://public-app:5173;
        }

        # Общие настройки для проксирования к Vite
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # --- ПРАВИЛО №3: Обработка PHP ---
    # Этот блок отвечает за фактическое выполнение PHP-кода для Laravel
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Логирование
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}